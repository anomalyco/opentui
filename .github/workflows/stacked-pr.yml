name: Stacked PR Check

on:
  pull_request:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Stacked PR Check
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed packages
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD \
            | sed -n 's#^\(packages/[^/]*\)/.*#\1#p' \
            | sort -u > "$RUNNER_TEMP/changed-packages"
          # JS tests import the host native library. bun install only has the
          # published optionalDependency, which does not include this branch's ABI.
          if grep -E -qx 'packages/(native|core|react|solid|three|examples|ssh)' "$RUNNER_TEMP/changed-packages"; then
            echo "build_native=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Zig
        if: steps.changes.outputs.build_native == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig cache
        if: steps.changes.outputs.build_native == 'true'
        uses: actions/cache@v5
        with:
          path: packages/native/.zig-cache
          key: zig-v1-${{ runner.os }}-0.16.0-${{ github.run_id }}-${{ github.job }}
          restore-keys: zig-v1-${{ runner.os }}-0.16.0-

      - name: Install dependencies
        run: bun install

      - name: Build native library
        if: steps.changes.outputs.build_native == 'true'
        working-directory: packages/core
        run: bun run build:native --skip-symbols

      - name: Check formatting and lint
        run: |
          bun run fmt:check
          bun run lint:ci

      - name: Test changed packages
        run: |
          while IFS= read -r package; do
            [ -f "$package/package.json" ] || continue
            bun run --cwd "$package" --if-present typecheck
            bun run --cwd "$package" --if-present test
          done < "$RUNNER_TEMP/changed-packages"
