name: Stacked PR Check

on:
  pull_request:
    branches-ignore: [main, "[0-9]+.[0-9]+.x"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Stacked PR Check
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Find changed packages
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD \
            | sed -n 's#^\(packages/[^/]*\)/.*#\1#p' \
            | sort -u > "$RUNNER_TEMP/changed-packages"
          # JS tests import the host native library. bun install only has the
          # published optionalDependency, which does not include this branch's ABI.
          if grep -E -qx 'packages/(native|core|react|solid|three|examples|ssh)' "$RUNNER_TEMP/changed-packages"; then
            echo "build_native=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -qx packages/core "$RUNNER_TEMP/changed-packages"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Zig
        if: steps.changes.outputs.build_native == 'true'
        uses: ./.github/actions/setup-zig

      - name: Restore Zig cache
        if: steps.changes.outputs.build_native == 'true'
        uses: ./.github/actions/restore-zig-cache
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          kind: lib

      - name: Restore Bun install cache
        uses: ./.github/actions/restore-bun-cache

      - name: Install dependencies
        run: bun install

      - name: Build native library
        if: steps.changes.outputs.build_native == 'true'
        working-directory: packages/core
        run: bun run build:native --skip-symbols

      - name: Build core library
        if: steps.changes.outputs.core == 'true'
        working-directory: packages/core
        run: bun run build:lib

      - name: Check formatting and lint
        run: |
          bun run fmt:check
          bun run lint:ci

      - name: Test changed packages
        run: |
          while IFS= read -r package; do
            [ -f "$package/package.json" ] || continue
            for script in typecheck test; do
              bun -p "require('./$package/package.json').scripts?.['$script'] ?? ''" | grep -q . || continue
              bun run --cwd "$package" "$script"
            done
          done < "$RUNNER_TEMP/changed-packages"
