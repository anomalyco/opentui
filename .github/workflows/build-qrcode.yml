name: Build QRCode

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-ubuntu-2404, blacksmith-8vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install

      - name: Restore native bottle
        id: bottle
        uses: ./.github/actions/restore-native-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Setup Zig
        if: steps.bottle.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Restore Zig cache
        if: steps.bottle.outputs.cache-hit != 'true' && runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: packages/native/.zig-cache
          key: zig-v1-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: zig-v1-${{ runner.os }}-${{ env.ZIG_VERSION }}-

      - name: Build core
        run: bun scripts/native-bottle.ts package --hit "${{ steps.bottle.outputs.cache-hit }}" --zig "${{ env.ZIG_VERSION }}" --skip-symbols --lib

      - name: Build
        run: |
          cd packages/qrcode
          bun run build

      - name: Enable Linux core dumps
        if: runner.os == 'Linux'
        uses: ./.github/actions/enable-linux-coredumps

      - name: Run tests
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          cd packages/qrcode
          bun run test

      - name: Upload Linux core dumps
        if: failure() && runner.os == 'Linux'
        uses: ./.github/actions/upload-linux-coredumps
        with:
          name: crash-dumps-qrcode-${{ matrix.os }}-${{ github.run_attempt }}

  build-complete:
    name: QRCode - Build and Test
    needs: [test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          echo "All tests passed"
