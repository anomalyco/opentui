name: macOS stdout writer checks

# Throwaway: checks the stdout writer thread on macOS (388, PR 4) on GitHub-hosted runners.
on:
  push:
    branches: [harden/388-macos-stdout-writer-ci]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Writer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Restore FFmpeg build cache
        uses: actions/cache@v5
        with:
          path: |
            packages/native/.cache/ffmpeg/prefix
            packages/native/.cache/ffmpeg/downloads
          key: ffmpeg-v1-${{ matrix.os }}-${{ hashFiles('packages/native/scripts/build-ffmpeg.ts') }}

      - name: Install dependencies
        run: bun install

      - name: Build native library
        working-directory: packages/core
        run: bun run build:native

      - name: Run checks
        run: bash .github/probe/ci.sh

      - name: Print summary
        if: always()
        run: |
          cat probe-out/summary.txt
          { echo '```'; cat probe-out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-stdout-writer-${{ matrix.os }}
          path: probe-out
          if-no-files-found: error
