name: Build Core

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.x"]

permissions:
  contents: read

concurrency:
  # Each commit gets its own group. In a shared group, the next push cancels a waiting run, and that
  # commit gets no CI.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 26.13.0

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  # A pull request that changes only packages/rust skips the TypeScript jobs; the gate accepts that. A pull request
  # that does not change native inputs runs the fast Linux job instead of this cross-OS matrix.
  build:
    name: Build Native Libraries
    needs: changes
    if: needs.changes.outputs.rust_only != 'true' && (github.event_name == 'push' || needs.changes.outputs.native == 'true')
    runs-on: blacksmith-12vcpu-macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install

      - name: Restore native bottle
        id: bottle
        uses: ./.github/actions/restore-native-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Setup cross-platform symbol tools
        if: steps.bottle.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-native-symbol-tools

      # Native video statically links FFmpeg. Its static libraries depend only on the pinned build script.
      - name: Restore FFmpeg build cache
        uses: actions/cache@v5
        with:
          path: |
            packages/native/.cache/ffmpeg/prefix
            packages/native/.cache/ffmpeg/downloads
          key: ffmpeg-v1-${{ runner.os }}-${{ hashFiles('packages/native/scripts/build-ffmpeg.ts') }}

      - name: Build or package native libraries
        run: bun scripts/native-bottle.ts package --hit "${{ steps.bottle.outputs.cache-hit }}" --zig "${{ env.ZIG_VERSION }}" --all

      # FFmpeg's configure and make need a POSIX host, so Windows native tests link this cross-built prefix.
      # A bottle hit skips the FFmpeg build, so build the prefix here if the cache lacks it.
      - name: Build Windows FFmpeg prefix
        working-directory: packages/native
        run: bun scripts/build-ffmpeg.ts --target=x86_64-windows

      - name: Upload Windows FFmpeg prefix
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-x86_64-windows
          path: packages/native/.cache/ffmpeg/prefix/x86_64-windows/
          if-no-files-found: error
          retention-days: 1

      # A saved bottle already passed this compile check for the same inputs.
      - name: Build custom target without Ghostty VT
        if: steps.bottle.outputs.cache-hit != 'true'
        working-directory: packages/native
        run: zig build -Dlibrary-target=x86_64-freebsd -Doptimize=ReleaseFast

      - name: Save native bottle
        if: steps.bottle.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-native-bottle
        with:
          key: ${{ steps.bottle.outputs.key }}
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Verify release symbol archives
        run: bun packages/core/scripts/package-native-symbols.ts

      - name: Upload symbol verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols
          path: artifacts/native-symbols/*.zip
          if-no-files-found: error
          # As long as the Windows crash dumps, which need the PDB.
          retention-days: 7

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-libraries
          path: packages/core/node_modules/@opentui/core-*/**
          if-no-files-found: error
          retention-days: 1

  # The pull request pass: compile and run the quick suites on one Linux runner. It runs the same core code as the
  # cross-OS matrix, without the native tests and the other two operating systems. A pull request that changes native
  # inputs runs the matrix instead, because only a host build tests those.
  test-fast:
    name: Test (Linux)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.native != 'true' && needs.changes.outputs.core == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Restore Zig cache
        uses: ./.github/actions/restore-zig-cache
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          kind: lib

      - name: Restore Bun install cache
        uses: ./.github/actions/restore-bun-cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Enable Linux core dumps
        uses: ./.github/actions/enable-linux-coredumps

      # Native inputs did not change, so the bottle should hit. A miss builds the library and the core TypeScript
      # library from source instead of waiting for the cross-compile.
      - name: Restore native host bottle
        id: bottle
        uses: ./.github/actions/restore-native-host-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Build core
        run: bun scripts/native-bottle.ts package --hit "${{ steps.bottle.outputs.cache-hit }}" --zig "$ZIG_VERSION" --skip-symbols --lib

      # Both lanes run the same tests on fixed paths under the temp directory, so the Node lane gets its own.
      - name: Run Bun and Node TypeScript tests
        working-directory: packages/core
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          node_tmp="$RUNNER_TEMP/node-tests"
          node_log="$RUNNER_TEMP/test-js-node.log"
          mkdir -p "$node_tmp"
          (
            start=$SECONDS
            status=0
            TMPDIR="$node_tmp" TEMP="$node_tmp" TMP="$node_tmp" bun run test:js:node || status=$?
            echo "Node TypeScript tests took $((SECONDS - start))s"
            exit "$status"
          ) > "$node_log" 2>&1 &
          node_pid=$!

          # test:js leaves the pipe it writes to non-blocking. Without cat in between, printing the Node log
          # to the step output fails with EAGAIN.
          start=$SECONDS
          bun_status=0
          OTUI_TREE_SITTER_WORKER_PATH="$(bun -e 'import { resolve } from "node:path"; console.log(resolve("dist/parser.worker.js"))')" \
            bun run test:js 2>&1 | cat || bun_status=$?
          echo "Bun TypeScript tests took $((SECONDS - start))s"

          node_status=0
          wait "$node_pid" || node_status=$?
          if [ "$node_status" = 0 ]; then echo "::group::Node TypeScript tests"; fi
          cat "$node_log"
          if [ "$node_status" = 0 ]; then echo "::endgroup::"; fi
          echo "Bun tests exited with $bun_status, Node tests with $node_status"
          [ "$bun_status" = 0 ] && [ "$node_status" = 0 ]

      - name: Test packed distribution
        working-directory: packages/core
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          bun run test:dist --skip-build

      - name: Test separate ELF symbols
        run: bun test packages/core/scripts/native-symbols.test.ts

      - name: Test Node SEA executable
        working-directory: packages/core
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          bun run test:standalone --skip-build

      - name: Upload Linux core dumps
        if: failure()
        uses: ./.github/actions/upload-linux-coredumps
        with:
          name: crash-dumps-core-linux-${{ github.run_attempt }}

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust_only != 'true' && (github.event_name == 'push' || needs.changes.outputs.native == 'true')
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-12vcpu-macos-15
            platform: darwin-arm64
          - os: blacksmith-8vcpu-ubuntu-2404
            platform: linux-x64
          - os: blacksmith-8vcpu-windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Restore Zig cache
        id: zig-cache
        uses: ./.github/actions/restore-zig-cache
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          kind: test
          save: true

      - name: Restore Bun install cache
        id: bun-cache
        uses: ./.github/actions/restore-bun-cache
        with:
          save: true

      # Hash native files before install and test steps write into packages/native.
      - name: Restore native test result
        id: native-tested
        uses: actions/cache/restore@v5
        with:
          path: .native-tests-passed
          key: native-tests-v1-${{ matrix.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('packages/native/**', '.github/workflows/build-core.yml') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Save Bun install cache
        if: steps.bun-cache.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.key }}

      - name: Enable Linux core dumps
        if: runner.os == 'Linux'
        uses: ./.github/actions/enable-linux-coredumps

      # Native video statically links FFmpeg. Its static libraries depend only on the pinned build script.
      - name: Restore FFmpeg build cache
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: |
            packages/native/.cache/ffmpeg/prefix
            packages/native/.cache/ffmpeg/downloads
          key: ffmpeg-v1-${{ runner.os }}-${{ hashFiles('packages/native/scripts/build-ffmpeg.ts') }}

      # FFmpeg cannot build on Windows, so a cache miss waits for the build job's cross-built prefix.
      - name: Wait for Windows FFmpeg prefix
        if: runner.os == 'Windows' && steps.native-tested.outputs.cache-hit != 'true' && steps.ffmpeg.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/wait-for-job.ts --name "Build Native Libraries"

      - name: Download Windows FFmpeg prefix
        if: runner.os == 'Windows' && steps.native-tested.outputs.cache-hit != 'true' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-x86_64-windows
          path: packages/native/.cache/ffmpeg/prefix/x86_64-windows/

      # Windows Error Reporting writes a minidump when a node.exe that allows it crashes. Bun exits from its own
      # crash handler first.
      - name: Enable Windows crash dumps
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "$env:GITHUB_WORKSPACE\.crash-dumps"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
          New-ItemProperty -Force $wer -Name DontShowUI -PropertyType DWord -Value 1 | Out-Null
          $key = "$wer\LocalDumps\node.exe"
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name DumpFolder -PropertyType ExpandString -Value $dir | Out-Null
          New-ItemProperty -Force $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
          New-ItemProperty -Force $key -Name DumpCount -PropertyType DWord -Value 3 | Out-Null

      # Native tests build from source, so they run before this job gets the cross-compiled library.
      - name: Run native tests
        if: steps.native-tested.outputs.cache-hit != 'true'
        working-directory: packages/core
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          bun run test:native -Drequire-video
          bun run test:native:lifetime
          echo "${{ github.sha }}" > ../../.native-tests-passed

      - name: Save native test result
        if: steps.native-tested.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .native-tests-passed
          key: ${{ steps.native-tested.outputs.cache-primary-key }}

      # This job does not need the build job. Without a cached library for this runner, it waits for
      # this run's cross-compile only now, so its setup and native tests overlap the build.
      - name: Restore native host bottle
        id: bottle
        uses: ./.github/actions/restore-native-host-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          # This job downloads the build job's libraries instead of building them.
          ffmpeg: false

      - name: Install native host bottle
        if: steps.bottle.outputs.cache-hit == 'true'
        run: bun scripts/native-bottle.ts package --hit true --zig "${{ env.ZIG_VERSION }}" --skip-symbols

      - name: Wait for native libraries
        if: steps.bottle.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/wait-for-job.ts --name "Build Native Libraries"

      - name: Download native artifacts
        if: steps.bottle.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: native-libraries
          path: packages/core/node_modules/@opentui/

      # Package workflows restore this runner's library instead of building it.
      - name: Save native host bottle
        if: steps.bottle.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-native-host-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Verify native library
        run: |
          echo "Checking for ${{ matrix.platform }} native library..."
          ls -la packages/core/node_modules/@opentui/
          ls -la packages/core/node_modules/@opentui/core-${{ matrix.platform }}/

      - name: Build TypeScript library
        run: |
          cd packages/core
          bun run build:lib

      # Only a run that built the native tests holds their objects.
      - name: Save Zig cache
        if: steps.zig-cache.outputs.save == 'true' && steps.native-tested.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache.outputs.key }}

      # Both lanes run the same tests on fixed paths under the temp directory, so the Node lane gets its own.
      - name: Run Bun and Node TypeScript tests
        working-directory: packages/core
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          node_tmp="$RUNNER_TEMP/node-tests"
          node_log="$RUNNER_TEMP/test-js-node.log"
          mkdir -p "$node_tmp"
          (
            start=$SECONDS
            status=0
            TMPDIR="$node_tmp" TEMP="$node_tmp" TMP="$node_tmp" bun run test:js:node || status=$?
            echo "Node TypeScript tests took $((SECONDS - start))s"
            exit "$status"
          ) > "$node_log" 2>&1 &
          node_pid=$!

          # test:js leaves the pipe it writes to non-blocking. Without cat in between, printing the Node log
          # to the step output fails with EAGAIN.
          start=$SECONDS
          bun_status=0
          OTUI_TREE_SITTER_WORKER_PATH="$(bun -e 'import { resolve } from "node:path"; console.log(resolve("dist/parser.worker.js"))')" \
            bun run test:js 2>&1 | cat || bun_status=$?
          echo "Bun TypeScript tests took $((SECONDS - start))s"

          node_status=0
          wait "$node_pid" || node_status=$?
          if [ "$node_status" = 0 ]; then echo "::group::Node TypeScript tests"; fi
          cat "$node_log"
          if [ "$node_status" = 0 ]; then echo "::endgroup::"; fi
          echo "Bun tests exited with $bun_status, Node tests with $node_status"
          [ "$bun_status" = 0 ] && [ "$node_status" = 0 ]

      - name: Test packed distribution
        if: runner.os == 'Linux'
        working-directory: packages/core
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          bun run test:dist --skip-build

      - name: Test separate ELF symbols
        if: runner.os == 'Linux'
        run: bun test packages/core/scripts/native-symbols.test.ts

      - name: Test Node SEA executable
        if: runner.os == 'Linux'
        working-directory: packages/core
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          bun run test:standalone --skip-build

      - name: Upload Linux core dumps
        if: failure() && runner.os == 'Linux'
        uses: ./.github/actions/upload-linux-coredumps
        with:
          name: crash-dumps-core-${{ matrix.os }}-${{ github.run_attempt }}

      - name: Upload Windows crash dumps
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: crash-dumps-core-${{ matrix.os }}-${{ github.run_attempt }}
          # The DLL that crashed. Its PDB is in the native-symbols artifact of the same native inputs.
          path: |
            ${{ github.workspace }}/.crash-dumps
            packages/core/node_modules/@opentui/core-win32-x64/opentui.dll
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
          include-hidden-files: true

  # Each package's Windows tests take seconds, and a Windows runner takes about a minute to set up, so
  # the packages share this job. Their own workflows test them on Linux and macOS.
  packages-windows:
    name: Test packages (Windows)
    needs: changes
    if: needs.changes.outputs.rust_only != 'true' && (github.event_name == 'push' || needs.changes.outputs.native == 'true')
    permissions:
      contents: read
      actions: read
    runs-on: blacksmith-8vcpu-windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      # This job compiles only the ABI check, which the test key holds too.
      - name: Restore Zig cache
        uses: ./.github/actions/restore-zig-cache
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          kind: test

      - name: Restore Bun install cache
        uses: ./.github/actions/restore-bun-cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install

      - name: Restore native host bottle
        id: bottle
        uses: ./.github/actions/restore-native-host-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          # This job downloads the build job's libraries instead of building them.
          ffmpeg: false

      - name: Install native host bottle
        if: steps.bottle.outputs.cache-hit == 'true'
        run: bun scripts/native-bottle.ts package --hit true --zig "${{ env.ZIG_VERSION }}" --skip-symbols

      - name: Wait for native libraries
        if: steps.bottle.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/wait-for-job.ts --name "Build Native Libraries"

      - name: Download native artifacts
        if: steps.bottle.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: native-libraries
          path: packages/core/node_modules/@opentui/

      - name: Build packages
        id: build
        run: |
          (cd packages/core && bun run build:lib)
          for package in react solid keymap; do (cd "packages/$package" && bun run build --ci); done
          for package in qrcode ssh; do (cd "packages/$package" && bun run build); done

      # Run every package's tests even when an earlier package fails.
      - name: Typecheck SSH
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/ssh
        run: bun run typecheck

      - name: Test React
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/react
        run: bun run test

      - name: Test Solid
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/solid
        run: bun run test

      - name: Test Keymap
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/keymap
        run: bun run test

      - name: Test QRCode
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/qrcode
        run: bun run test

      - name: Test SSH
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/ssh
        run: bun run test

  bun-1-compat:
    name: Bun 1.3 compatibility
    needs: [changes, build]
    if: github.event_name == 'push' || needs.changes.outputs.native == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1

      - name: Restore Bun install cache
        uses: ./.github/actions/restore-bun-cache

      # Setup runtime Bun overwrites ~/.bun/bin/bun, so this step must not save it.
      - name: Setup development Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
          no-cache: true

      - name: Install dependencies
        run: bun install

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          name: native-libraries
          path: packages/core/node_modules/@opentui/

      - name: Setup runtime Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Test portable FFI arguments
        working-directory: packages/core
        run: |
          test "$(bun --version)" = "1.3.14"
          bun test src/tests/audio.test.ts src/tests/clipboard-native-lifecycle.test.ts src/tests/image.test.ts

  rust-linux:
    name: Rust (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        id: rust
        uses: ./.github/actions/setup-rust

      - name: Install dependencies
        run: bun install

      # A Rust-only pull request skips Core's and keymap's tests, which also run these checks.
      - name: Check the generated ABI files
        working-directory: packages/core
        run: bun run check:abi

      - name: Check the generated tables
        working-directory: packages/keymap
        run: bun scripts/rust-tables.ts --check

      - name: Test
        working-directory: packages/rust
        run: sh test.sh ${{ steps.rust.outputs.linkage }}

      # libopentui.a carries Zig's libc++, for musl as for glibc, so neither needs one on the runner. Without the
      # tree-sitter feature nothing compiles C for musl.
      - name: Build the musl library
        if: steps.rust.outputs.linkage == 'all'
        working-directory: packages/native
        run: zig build -Doptimize=ReleaseFast -Dlibrary-target=x86_64-linux-musl

      # The default features link statically.
      - name: Test static linking with musl
        if: steps.rust.outputs.linkage == 'all'
        working-directory: packages/rust
        run: |
          rustup target add x86_64-unknown-linux-musl
          OPENTUI_LIB_DIR="$PWD/../native/lib/x86_64-linux-musl" cargo test --locked -p opentui \
            --target x86_64-unknown-linux-musl --test headless --test widgets

      - name: Check the other targets
        working-directory: packages/rust
        run: sh scripts/check-targets.sh

  # Not in the gate, and a pull request runs only Rust (Linux), so these two are push-only.
  rust-windows:
    name: Rust (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'push'
    runs-on: blacksmith-8vcpu-windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Windows links opentui.dll with the default features too; test.sh runs one pass with them.
      - name: Test
        working-directory: packages/rust
        run: sh test.sh shared

  # Not in the gate yet, like Rust (Windows), and push-only for the same reason.
  rust-macos:
    name: Rust (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'push'
    runs-on: blacksmith-12vcpu-macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        id: rust
        uses: ./.github/actions/setup-rust

      - name: Test
        working-directory: packages/rust
        run: sh test.sh ${{ steps.rust.outputs.linkage }}

  # Gate job for branch protection
  build-complete:
    name: Core - Build and Test
    needs: [changes, build, test, test-fast, packages-windows, bun-1-compat, rust-linux]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      # Without the changes job no skip is known to be safe. A pull request without native changes runs the fast
      # Linux job and must skip the cross-OS matrix; a pull request with them runs the matrix. A Rust job may skip
      # when no path it tests changed.
      - name: Check test results
        env:
          CHANGES: ${{ needs.changes.result }}
          EVENT: ${{ github.event_name }}
          NATIVE: ${{ needs.changes.outputs.native }}
          CORE: ${{ needs.changes.outputs.core }}
          RUST: ${{ needs.changes.outputs.rust }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          TEST_FAST: ${{ needs['test-fast'].result }}
          WINDOWS: ${{ needs['packages-windows'].result }}
          BUN13: ${{ needs['bun-1-compat'].result }}
          RUST_LINUX: ${{ needs['rust-linux'].result }}
        run: |
          set -eu
          [ "$CHANGES" = success ] || { echo "Change detection: $CHANGES"; exit 1; }
          [ "$RUST_LINUX" = success ] || [ "$RUST_LINUX-$RUST" = skipped-false ] || { echo "Rust (Linux) failed: $RUST_LINUX"; exit 1; }
          if [ "$EVENT" = pull_request ] && [ "$NATIVE" != true ]; then
            for result in "$BUILD" "$TEST" "$WINDOWS" "$BUN13"; do
              [ "$result" = skipped ] || { echo "A cross-OS job must not run on this pull request: $result"; exit 1; }
            done
            [ "$TEST_FAST" = success ] || [ "$TEST_FAST-$CORE" = skipped-false ] || { echo "Tests failed: $TEST_FAST"; exit 1; }
          else
            for result in "$BUILD" "$TEST" "$WINDOWS" "$BUN13"; do
              [ "$result" = success ] || { echo "A cross-OS job failed: $result"; exit 1; }
            done
            [ "$TEST_FAST" = skipped ] || { echo "The fast Linux job ran beside the cross-OS matrix: $TEST_FAST"; exit 1; }
          fi
          echo "All tests passed"
