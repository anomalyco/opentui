name: Build React

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.x"]

permissions:
  contents: read

concurrency:
  # Each commit gets its own group. In a shared group, the next push cancels a waiting run, and that
  # commit gets no CI.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  # A pull request that changes only packages/rust skips the tests; the gate accepts that.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Restore Zig cache
        id: zig-cache
        uses: ./.github/actions/restore-zig-cache
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          kind: lib
          save: true

      - name: Restore Bun install cache
        uses: ./.github/actions/restore-bun-cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install

      - name: Restore native host bottle
        id: bottle
        uses: ./.github/actions/restore-native-host-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Build core
        run: bun scripts/native-bottle.ts package --hit "${{ steps.bottle.outputs.cache-hit }}" --zig "${{ env.ZIG_VERSION }}" --skip-symbols --lib

      # Only a run that built the library holds its objects.
      - name: Save Zig cache
        if: steps.zig-cache.outputs.save == 'true' && steps.bottle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache.outputs.key }}

      - name: Build
        run: |
          cd packages/react
          bun run build --ci

      - name: Enable Linux core dumps
        if: runner.os == 'Linux'
        uses: ./.github/actions/enable-linux-coredumps

      - name: Run tests
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          cd packages/react
          bun run test

      - name: Upload Linux core dumps
        if: failure() && runner.os == 'Linux'
        uses: ./.github/actions/upload-linux-coredumps
        with:
          name: crash-dumps-react-${{ matrix.os }}-${{ github.run_attempt }}

  # Gate job for branch protection
  build-complete:
    name: React - Build and Test
    needs: [changes, test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      # Without the changes job no skip is known to be safe. The tests may skip only on a Rust-only pull request.
      - name: Check test results
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST_ONLY: ${{ needs.changes.outputs.rust_only }}
          TYPESCRIPT: ${{ needs.test.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "Change detection: $CHANGES"; exit 1; }
          for result in $TYPESCRIPT; do
            [ "$result" = success ] || [ "$result-$RUST_ONLY" = skipped-true ] || { echo "Tests failed"; exit 1; }
          done
          echo "All tests passed"
