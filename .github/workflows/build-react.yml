name: Build React

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  pull_request:
    branches: [main, "[0-9]+.[0-9]+.x"]

permissions:
  contents: read

concurrency:
  # Each commit gets its own group. In a shared group, the next push cancels a waiting run, and that
  # commit gets no CI.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install

      - name: Restore native host bottle
        id: bottle
        uses: ./.github/actions/restore-native-host-bottle
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      # The native ABI check in packages/core/scripts/build.ts needs Zig even when a cache skips the Zig build.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Build core
        run: bun scripts/native-bottle.ts package --hit "${{ steps.bottle.outputs.cache-hit }}" --zig "${{ env.ZIG_VERSION }}" --skip-symbols --lib

      - name: Build
        run: |
          cd packages/react
          bun run build --ci

      - name: Enable Linux core dumps
        if: runner.os == 'Linux'
        uses: ./.github/actions/enable-linux-coredumps

      - name: Run tests
        run: |
          if [ "$(uname -s)" = Linux ]; then ulimit -c unlimited; fi
          cd packages/react
          bun run test

      - name: Upload Linux core dumps
        if: failure() && runner.os == 'Linux'
        uses: ./.github/actions/upload-linux-coredumps
        with:
          name: crash-dumps-react-${{ matrix.os }}-${{ github.run_attempt }}

  # Gate job for branch protection
  build-complete:
    name: React - Build and Test
    needs: [test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          echo "All tests passed"
