name: Restore Zig cache
description: >-
  Restore the Zig cache that setup-zig points ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR at
  ($GITHUB_WORKSPACE/.zig-cache). Jobs that compile the same things share a kind. Only pushes to main that change
  native inputs save it, from the one job per kind and runner that passes save. Release and publish jobs must not
  use it.
inputs:
  zig-version:
    description: Zig version; a new version starts an empty cache
    required: true
  kind:
    description: lib (host library and ABI check) or test (native tests and ABI check)
    required: true
  save:
    description: This job saves the cache for its kind on pushes to main
    required: false
    default: "false"
outputs:
  key:
    description: Cache key for actions/cache/save
    value: ${{ steps.restore.outputs.cache-primary-key }}
  save:
    description: true when this job should save the cache after its Zig work
    value: ${{ steps.policy.outputs.save == 'true' && steps.restore.outputs.cache-hit != 'true' }}
runs:
  using: composite
  steps:
    - id: policy
      shell: bash
      run: echo "save=${{ inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

    # Each change to the C dependencies or the native sources gets a new key, and every job restores the nearest
    # older entry. Zig's cache is content-addressed, so older objects are reused or ignored, never wrong.
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: .zig-cache
        key: zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ inputs.kind }}-${{ hashFiles('packages/native/build.zig.zon', 'packages/native/scripts/prepare-zig-deps.sh', 'packages/native/src/vendor/zig-deps.tar.gz') }}-${{ hashFiles('packages/native/build.zig', 'packages/native/src/**', 'packages/native/include/**', 'packages/native/examples/**', 'packages/core/scripts/native-abi.zig') }}
        restore-keys: |
          zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ inputs.kind }}-${{ hashFiles('packages/native/build.zig.zon', 'packages/native/scripts/prepare-zig-deps.sh', 'packages/native/src/vendor/zig-deps.tar.gz') }}-
          zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ inputs.kind }}-

    # Zig never deletes from its cache, so each saved entry would hold every older build. A job that will save
    # starts empty once the restored cache passes 2 GB; fresh builds take 0.8 GB (lib) and 1.3 GB (test).
    - if: steps.policy.outputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        size_mb=0
        if [ -d .zig-cache ]; then
          size_mb="$(du -sm .zig-cache | cut -f1)"
        fi
        echo "Zig cache: $size_mb MB"
        if [ "$size_mb" -gt 2048 ]; then
          echo "Over 2048 MB; this job starts with an empty Zig cache"
          rm -rf .zig-cache
        fi
