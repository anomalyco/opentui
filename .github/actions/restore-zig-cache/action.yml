name: Restore Zig cache
description: >-
  Restore the Zig cache that mlugg/setup-zig points ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR at
  ($GITHUB_WORKSPACE/.zig-cache). Jobs that compile the same things share a kind. Only pushes to main save it, from
  the one job per kind and runner that passes save. Release and publish jobs must not use it.
inputs:
  zig-version:
    description: Zig version; a new version starts an empty cache
    required: true
  kind:
    description: lib (host library and ABI check) or test (native tests and ABI check)
    required: true
  save:
    description: This job saves the cache for its kind on pushes to main
    required: false
    default: "false"
outputs:
  key:
    description: Cache key for actions/cache/save
    value: ${{ steps.restore.outputs.cache-primary-key }}
  save:
    description: true when this job should save the cache after its Zig work
    value: ${{ steps.policy.outputs.save == 'true' && steps.restore.outputs.cache-hit != 'true' }}
runs:
  using: composite
  steps:
    - id: policy
      shell: bash
      run: echo "save=${{ inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

    # The key changes only with the C sources Zig compiles, not with every native change. A job that saves starts
    # empty, so a saved entry never carries objects from an older key.
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: .zig-cache
        key: zig-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ inputs.kind }}-${{ hashFiles('packages/native/build.zig.zon', 'packages/native/scripts/prepare-zig-deps.sh', 'packages/native/src/vendor/zig-deps.tar.gz') }}
        restore-keys: ${{ steps.policy.outputs.save != 'true' && format('zig-cache-v1-{0}-{1}-{2}-{3}-', runner.os, runner.arch, inputs.zig-version, inputs.kind) || '' }}
