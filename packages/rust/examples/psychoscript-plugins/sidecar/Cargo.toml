[package]
name = "psychoscript-plugins-sidecar"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Benchmarks sidecar helper round trips for PsychoScript plugins in an OpenTUI Rust app"
default-run = "sidecar-bench"

[dependencies]
psychoscript.workspace = true
serde_json.workspace = true

[[bin]]
name = "sidecar-bench"
path = "src/main.rs"

# The Rust helper: JSON-RPC 2.0 over stdin/stdout, serde_json and std only.
[[bin]]
name = "helper-rust"
path = "helpers/rust/main.rs"
