[package]
name = "opentui-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Serve OpenTUI apps over SSH, one app per session"

[features]
default = ["static"]
# opentui's static feature.
static = ["opentui/static"]

[dependencies]
bytes = "1.7"
opentui = { path = "../opentui", default-features = false }
# Only for its link metadata, which build.rs needs to find the native library for tests and examples.
opentui-sys = { path = "../opentui-sys", default-features = false }
rand = "0.10"
# ring instead of the default aws-lc-rs, which needs CMake and NASM on Windows.
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
