[package]
name = "opentui-sys"
version.workspace = true
edition.workspace = true
license = "MIT AND LGPL-2.1-or-later"
publish = false
links = "opentui"
description = "Raw FFI declarations for OpenTUI's checked C ABI"

[lints]
workspace = true

[features]
default = ["static"]
# Link libopentui.a instead of libopentui.so or libopentui.dylib, and on Windows MSVC opentui-static.lib instead of
# opentui.dll. The Windows GNU targets link opentui.dll either way.
static = []
