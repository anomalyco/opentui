[workspace]
members = ["crates/opentui-sys", "crates/opentui", "crates/opentui-ssh"]
resolver = "3"

[workspace.package]
version = "0.9.8"
edition = "2024"
# Let chains.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/anomalyco/opentui"
homepage = "https://opentui.com"
# The tests read Core's fixtures and conformance vectors, which a package does not hold.
exclude = ["tests/"]

# The exact versions keep the crates and their generated declarations from one release.
[workspace.dependencies]
opentui = { path = "crates/opentui", version = "=0.9.8", default-features = false }
opentui-sys = { path = "crates/opentui-sys", version = "=0.9.8", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
missing_safety_doc = "deny"
